[program:web]
command=bash -c "/opt/press-agent/wait-for-it.sh redis://127.0.0.1:25025 && /opt/press-agent/env/bin/gunicorn --bind 127.0.0.1:25052 --workers 2 agent.web:application"
environment=PYTHONUNBUFFERED=1
autostart=true
autorestart=true
stdout_logfile=/opt/press-agent/logs/web.log
stderr_logfile=/opt/press-agent/logs/web.error.log
user=frappe
directory=/opt/press-agent

[program:redis]
command=redis-server redis.conf
autostart=true
autorestart=true
stdout_logfile=/opt/press-agent/logs/redis.log
stderr_logfile=/opt/press-agent/logs/redis.error.log
user=frappe
directory=/opt/press-agent

[program:worker]
command=bash -c "/opt/press-agent/wait-for-it.sh redis://127.0.0.1:25025 && exec /opt/press-agent/env/bin/rq worker  --url redis://127.0.0.1:25025 high default low"
environment=PYTHONUNBUFFERED=1
autostart=true
autorestart=true
stopwaitsecs=1500
killasgroup=true
numprocs=2
process_name=%(program_name)s-%(process_num)d
stdout_logfile=/opt/press-agent/logs/worker.log
stderr_logfile=/opt/press-agent/logs/worker.error.log
user=frappe
directory=/opt/press-agent





[program:worker_backup]
command=bash -c "/opt/press-agent/wait-for-it.sh redis://127.0.0.1:25025 && exec /opt/press-agent/env/bin/rq worker  --url redis://127.0.0.1:25025 backup high default low"
environment=PYTHONUNBUFFERED=1
autostart=true
autorestart=true
stopwaitsecs=1500
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
stdout_logfile=/opt/press-agent/logs/worker_backup.log
stderr_logfile=/opt/press-agent/logs/worker_backup.error.log
user=frappe
directory=/opt/press-agent



[group:agent]






programs=web, redis, worker, worker_backup